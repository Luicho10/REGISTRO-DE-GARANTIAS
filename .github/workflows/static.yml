# Deploy React/Vite application to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Configure Supabase public URL
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL no está configurada en las variables del repositorio."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env.production
          echo "URL de Supabase configurada correctamente. La clave publishable se obtiene del cliente."

      - name: Build application
        run: npm run build

      - name: Verify Supabase key in production bundle
        run: |
          if grep -Rqs 'sb_publishable_' dist/assets; then
            echo "Clave publishable detectada en el bundle."
          else
            echo "ERROR: No se encontró una clave publishable en el bundle de producción."
            exit 1
          fi
          if grep -Rqs 'apikey:\`sb_publishable_\`' dist/assets; then
            echo "ERROR: El bundle contiene una clave truncada sb_publishable_."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
